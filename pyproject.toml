[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewops-core"
version = "0.1.0"
description = "A local-first agent runtime with reusable routing, memory, tools, and dashboard APIs."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
  {name = "Joseph Paredes"}
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "chromadb>=0.5.0",
  "crewai>=1.11.0",
  "crewai-tools>=0.12.0",
  "ddgs>=9.0.0",
  "fastapi>=0.135.0",
  "google-generativeai>=0.8.0",
  "httpx>=0.27.0",
  "litellm>=1.65.0",
  "playwright>=1.44.0",
  "psycopg2-binary>=2.9.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "uvicorn>=0.42.0",
]

[project.scripts]
crewops-core = "crewops_core.cli:main"
crewops-core-dashboard = "crewops_core.dashboard_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["crewops_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
