name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install chromium --with-deps
          pip install pytest pytest-cov

      - name: Forbidden string audit
        run: |
          python scripts/audit_forbidden_strings.py .

      - name: Run tests
        run: |
          pytest \
            --cov=crewops_core \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

      - name: Boot dashboard
        run: |
          set -euo pipefail
          cp .env.example .env
          DASHBOARD_LOG="$(mktemp)"
          echo "DASHBOARD_LOG=$DASHBOARD_LOG" >> $GITHUB_ENV
          crewops-core-dashboard >"$DASHBOARD_LOG" 2>&1 &
          echo "DASHBOARD_PID=$!" >> $GITHUB_ENV
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/status >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat "$DASHBOARD_LOG"
            exit 1
          fi

      - name: Check endpoints
        run: |
          set -euo pipefail
          curl -sf http://localhost:8080/
          curl -sf http://localhost:8080/api/status
          curl -sf http://localhost:8080/api/services/health
        env:
          DASHBOARD_LOG: ${{ env.DASHBOARD_LOG }}
        continue-on-error: false

      - name: Print dashboard log on failure
        if: failure()
        run: |
          if [ -n "${DASHBOARD_LOG:-}" ] && [ -f "${DASHBOARD_LOG}" ]; then
            cat "${DASHBOARD_LOG}"
          fi

      - name: Stop dashboard
        if: always()
        run: |
          kill ${DASHBOARD_PID:-} 2>/dev/null || true
          if [ -n "${DASHBOARD_LOG:-}" ] && [ -f "${DASHBOARD_LOG}" ]; then
            rm -f "${DASHBOARD_LOG}"
          fi
