name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install chromium --with-deps
          pip install pytest pytest-cov

      - name: Forbidden string audit
        run: |
          python scripts/audit_forbidden_strings.py .

      - name: Run tests
        run: |
          pytest \
            --cov=crewops_core \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

      - name: Boot dashboard
        run: |
          cp .env.example .env
          crewops-core-dashboard &
          echo "DASHBOARD_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/status && break
            sleep 1
          done

      - name: Check endpoints
        run: |
          curl -sf http://localhost:8080/
          curl -sf http://localhost:8080/api/status
          curl -sf http://localhost:8080/api/services/health

      - name: Stop dashboard
        if: always()
        run: kill $DASHBOARD_PID 2>/dev/null || true
